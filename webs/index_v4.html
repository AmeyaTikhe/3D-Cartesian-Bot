<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Dot Coordinates</title>
    <style>
        html {
            margin: 0;
            padding: 0;
        }
        body {
            font-family: Arial, sans-serif;
            align-content: center;
            text-align: center;
            background-color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        h1 {
            color: #333;
        }
        #coordinate-list {
            width: 90%;
            margin: auto;
            padding: 10px;
            background: rgb(0, 0, 0);
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
            text-align: left;
            color: greenyellow;
            height: 300px; 
            overflow-y: auto;
            overflow-x: auto;
        }
        
        .dot {
            padding: 10px;
        }
    </style>
</head>
<body>
    <h1>TERMINAL</h1>
    <div id = "display">
    <div id="coordinate-list"></div>
    </div>
    
    <script>
        let socket;
        const coordinateList = document.getElementById("coordinate-list");

        let coordQueue = [];
        let isWaitingForAck = false;

        function logToDiv(message, color = 'greenyellow') {
            const logDiv = document.createElement("div");
            logDiv.textContent = message;
            logDiv.style.color = color;
            coordinateList.appendChild(logDiv);
            coordinateList.scrollTop = coordinateList.scrollHeight;
        }
        
        function connectOpenCVWebSocket() {
            socket = new WebSocket("ws://localhost:9000");
            const coordinateList = document.getElementById("coordinate-list");
        
            socket.onmessage = function(event) {
                try {
                const data = JSON.parse(event.data);
                logToDiv(`Received: DOT X=${data.x}, Y=${data.y}`, 'cyan');

                // send coordinates to ESP via HTTP
                coordQueue.push({ x: data.x, y: data.y });
                logToDiv(`Queued DOT at X=${data.x}, Y=${data.y}`, 'orange');
                processNextCoordinate();  // Try to process if nothing is in progress  
                }
                catch (err) {
                    logToDiv(`Error parsing message: ${event.data}`, 'red');
                }  
            };
        
            socket.onopen = function() {
                logToDiv("Connected to WebSocket server", 'lime');
            };
        
            socket.onclose = function() {
                logToDiv(" WebSocket closed. Reconnecting in 2 seconds...", 'gray');
                setTimeout(connectOpenCVWebSocket, 2000); // Retry connection
            };
        
            socket.onerror = function(error) {
                logToDiv(" WebSocket Error: " + error.message, 'red');
                socket.close(); // Close the socket and retry
            };
        }

        function processNextCoordinate() {
            if (isWaitingForAck || coordQueue.length === 0) return;
    
            const coords = coordQueue.shift(); // Get the next one
            isWaitingForAck = true;

            logToDiv(`DOT: X=${coords.x}, Y=${coords.y}`, 'white');

            logToDiv(`Sending to ESP: X=${coords.x}, Y=${coords.y}`, 'yellow');
            sendCoordinatesToESP(coords);
        }
              
        function sendCoordinatesToESP(coords) {
            //fetch('/update_coords', {
            //const ESP_IP = "192.168.183.123";

            fetch("http://192.168.183.123/update_coords", {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json'
              },
              body: JSON.stringify(coords)
            })
            .then(response => response.text())
            .then(text => {
                if (text.trim() === "true") {
                    logToDiv("✅ ACK: Coordinates received successfully", 'lightgreen');
                } else {
                    logToDiv("❌ ACK: ESP responded with error", 'red');
                }

                isWaitingForAck = false;
                processNextCoordinate();
            })
            .catch(error => {
                logToDiv("❌ Error sending to ESP: " + error.message, 'red');

                isWaitingForAck = false;
                processNextCoordinate();
            });
        }

        connectOpenCVWebSocket(); // Start WebSocket connection        
    </script>
</body>
</html>
