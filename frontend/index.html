<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Dot Coordinates</title>
    <style>
        html {
            margin: 0;
            padding: 0;
        }
        body {
            font-family: Arial, sans-serif;
            align-content: center;
            text-align: center;
            background-color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        h1 {
            color: #333;
        }
        #coordinate-list {
            width: 90%;
            margin: auto;
            padding: 10px;
            background: rgb(0, 0, 0);
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
            text-align: left;
            color: greenyellow;
            height: 300px; 
            overflow-y: auto;
            overflow-x: auto;
        }
        
        .dot {
            padding: 10px;
        }
    </style>
</head>
<body>
    <h1>TERMINAL</h1>
    <div id = "display">
    <div id="coordinate-list"></div>
    </div>
    
    <script>
        let ESPsocket = new WebSocket("ws://192.168.247.123/ws");
        const coordinateList = document.getElementById("coordinate-list");
        let receivedCoordinates = []; // 2D array to store received coordinates
        let sendTimer;  


        function logToDiv(message, color = 'greenyellow') {
            const logDiv = document.createElement("div");
            logDiv.textContent = message;
            logDiv.style.color = color;
            coordinateList.appendChild(logDiv);
            coordinateList.scrollTop = coordinateList.scrollHeight;
        }

        ESPsocket.onopen = function() {
            logToDiv("WebSocket connection opened.", 'lime');
            //if (onopen) onopen();
        };
    
        ESPsocket.onerror = function(error) {
            logToDiv("WebSocket error: " + error.message, 'red');
            //if (onerror) onerror(error);
        };
    
        ESPsocket.onclose = function() {
            logToDiv("WebSocket closed.", 'gray');
            //if (onclose) onclose();
        };
        
        function connectOpenCVWebSocket() {
            let OCVsocket = new WebSocket("ws://localhost:9000");
            //const coordinateList = document.getElementById("coordinate-list");
            //const receivedCoordinates = []; // 2D array to store received coordinates
        
            OCVsocket.onmessage = function(event) {
                try {
                const data = JSON.parse(event.data);
                logToDiv(`Received: DOT X=${data.x}, Y=${data.y}`, 'cyan');

                // Store coordinates in 2D array
                receivedCoordinates.push([data.x, data.y]);

                // Reset the batch send timer
                clearTimeout(sendTimer);
                sendTimer = setTimeout(sendAllCoordinates, 2000); // Send after 2s of no new data
                }
                catch (err) {
                    logToDiv(`Error parsing message: ${event.data}`, 'red');
                }  
            };
        
            OCVsocket.onopen = function() {
                logToDiv("Connected to WebSocket server", 'lime');
            };
        
            OCVsocket.onclose = function() {
                logToDiv(" WebSocket closed. Reconnecting in 2 seconds...", 'gray');
                setTimeout(connectOpenCVWebSocket, 2000); // Retry connection
            };
        
            OCVsocket.onerror = function(error) {
                logToDiv(" WebSocket Error: " + error.message, 'red');
                OCVsocket.close(); // Close the socket and retry
            };
        }

        function sendCoordinatesToESP(message) {
            //logToDiv(`Sending to ESP: X=${coords.x}, Y=${coords.y}`, 'yellow');
            
            //const message = "C" + coords.x + "," + coords.y;

            logToDiv(`Trying to send: ${message}`, 'orange');

            if (ESPsocket && ESPsocket.readyState === WebSocket.OPEN) {
                ESPsocket.send(message);
                logToDiv(`Sent to ESP: ${message}`, 'yellow');
            } 
            else if (ESPsocket.readyState === WebSocket.CONNECTING) {
                logToDiv("⚠️ WebSocket is still connecting. Retrying in 100ms...", 'orange');
                setTimeout(() => sendCoordinatesToESP(message), 100); // retry later
            } 
            else {
                logToDiv(`❌ Socket not open. State = ${ESPsocket?.readyState}`, 'red');
            }
        }

        function sendAllCoordinates() {
            //ESPsocket = new WebSocket("ws://localhost:9001");
            //ESPsocket = new WebSocket("ws://esp32-webserver.local/ws");
            let fullmessage = "";
            logToDiv("Generating final message...", 'aqua');
            receivedCoordinates.forEach(([x, y], index) => {
                fullmessage += `${x},${y}`;
                if (index !== receivedCoordinates.length - 1) {
                fullmessage += ";"; // Use semicolon to separate coordinate pairs
                }
            });
            
            logToDiv("Sending final message to ESP...", 'aqua');
            sendCoordinatesToESP(fullmessage);
            receivedCoordinates = []; // clear after sending
        }

        connectOpenCVWebSocket(); // Start WebSocket connection        
    </script>
</body>
</html>
